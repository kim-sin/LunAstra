name: Apply CI portability fix

on:
  push:
    paths:
      - lunastra-ci-fix.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check lunastra-ci-fix.patch
          git apply lunastra-ci-fix.patch
          python -m py_compile luna_astra/*.py tools/*.py tests/*.py
          git diff --check
      - name: Run targeted regressions
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest -v tests.test_gitspace tests.test_codex_contract.ExecutionRoutingTests tests.test_codemap.CodeMapTests.test_zero_time_budget_reported
      - name: Publish fix and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -f lunastra-ci-fix.patch .github/workflows/apply-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix cross-platform CI and workspace isolation"
          git push origin HEAD:main
