name: Finalize LunAstra source upload

on:
  push:
    paths:
      - retry-go

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild source if bootstrap payload is present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(bootstrap-source.b64.*)
          if (( ${#parts[@]} > 0 )); then
            test ${#parts[@]} -eq 17
            cat bootstrap-source.b64.* | base64 -d > bootstrap-source.tar.xz
            echo "c710b79c4eff3b0531441d31d678ad1dd2381a34fd27a42fd6ad126bede42861  bootstrap-source.tar.xz" | sha256sum -c -
            rm -rf .bootstrap
            mkdir .bootstrap
            tar -xJf bootstrap-source.tar.xz -C .bootstrap
            test -f .bootstrap/LunAstra/README.md
            cp -a .bootstrap/LunAstra/. .
          fi
          rm -rf .bootstrap bootstrap-source.tar.xz bootstrap-source.b64.* bootstrap-go retry-go
          rm -f .github/workflows/bootstrap-source.yml .github/workflows/bootstrap-retry.yml
      - name: Commit final source state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish LunAstra 3.2.0 fixed-seven source"
          git push origin HEAD:main
