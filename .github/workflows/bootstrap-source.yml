name: Bootstrap LunAstra source

on:
  push:
    paths:
      - bootstrap-go

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild and verify source archive
        shell: bash
        run: |
          cat bootstrap-source.b64.* | base64 -d > bootstrap-source.tar.xz
          echo "c710b79c4eff3b0531441d31d678ad1dd2381a34fd27a42fd6ad126bede42861  bootstrap-source.tar.xz" | sha256sum -c -
      - name: Extract source tree
        shell: bash
        run: |
          rm -rf .bootstrap
          mkdir .bootstrap
          tar -xJf bootstrap-source.tar.xz -C .bootstrap
          test -f .bootstrap/LunAstra/README.md
          cp -a .bootstrap/LunAstra/. .
          rm -rf .bootstrap bootstrap-source.tar.xz bootstrap-source.b64.* bootstrap-go .github/workflows/bootstrap-source.yml
      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish LunAstra 3.2.0 fixed-seven source"
          git push origin HEAD:main
