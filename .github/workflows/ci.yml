name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run software tests
        run: python tools/validate.py --output "${{ runner.temp }}/lunastra-validation"
      - name: Build repository source archive
        run: python tools/release.py --source-output "${{ runner.temp }}/LunAstra-3.2.0-source.zip"
      - name: Build installable archive
        run: python tools/release.py --output "${{ runner.temp }}/LunAstra-3.2.0.zip"
      - name: Verify installable archive
        run: python tools/release.py --verify "${{ runner.temp }}/LunAstra-3.2.0.zip"
      - name: Extract installable archive
        run: python -c "import os,pathlib,zipfile; p=pathlib.Path(os.environ['RUNNER_TEMP']); zipfile.ZipFile(p/'LunAstra-3.2.0.zip').extractall(p/'lunastra-extracted')"
      - name: Retest archive integration paths
        working-directory: ${{ runner.temp }}/lunastra-extracted/LunAstra
        run: python tools/validate.py --output "${{ runner.temp }}/lunastra-archive-validation" --pattern "test_*integration.py"
      - name: Retest publishing and removal from archive
        working-directory: ${{ runner.temp }}/lunastra-extracted/LunAstra
        run: python tools/validate.py --output "${{ runner.temp }}/lunastra-publication-validation" --pattern "test_publication.py"
      - name: Retest advisory install and current-release observations
        working-directory: ${{ runner.temp }}/lunastra-extracted/LunAstra
        run: python tools/validate.py --output "${{ runner.temp }}/lunastra-connection-validation" --pattern "test_host_connection.py"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/lunastra-validation/
            ${{ runner.temp }}/lunastra-archive-validation/
            ${{ runner.temp }}/lunastra-publication-validation/
            ${{ runner.temp }}/lunastra-connection-validation/
          retention-days: 14
          if-no-files-found: warn

  publish-release:
    needs: test
    if: >-
      github.repository == 'kim-sin/LunAstra' &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: lunastra-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build and verify the tested archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          python tools/release.py --source-output "$RUNNER_TEMP/release/LunAstra-3.2.0-source.zip"
          python tools/release.py --output "$RUNNER_TEMP/release/LunAstra-3.2.0.zip"
          python tools/release.py --verify "$RUNNER_TEMP/release/LunAstra-3.2.0.zip"
          cd "$RUNNER_TEMP/release"
          sha256sum LunAstra-3.2.0.zip LunAstra-3.2.0-source.zip > SHA256SUMS.txt
      - name: Set repository discovery metadata when permitted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          gh api --method PUT "repos/$GITHUB_REPOSITORY/topics" --input - <<'JSON' >/tmp/topics.json 2>/tmp/topics.err
          {"names":["openai","codex","chatgpt","luna","multi-agent","agent-orchestration","ai-agent","coding-agent","subagents","developer-tools","automation","python","windows","macos","linux"]}
          JSON
          topics_rc=$?
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" \
            -f description='A moon dreaming of the stars — fixed-seven Luna orchestration for OpenAI Codex, with one lead and six persistent Luna workers.' \
            -F has_issues=true -F has_projects=false -F has_wiki=false -F has_discussions=false -F delete_branch_on_merge=true \
            >/tmp/repo-settings.json 2>/tmp/repo-settings.err
          repo_rc=$?
          set -e
          echo "topics API exit: $topics_rc" >> "$GITHUB_STEP_SUMMARY"
          echo "repository settings API exit: $repo_rc" >> "$GITHUB_STEP_SUMMARY"
          if [ "$topics_rc" -ne 0 ]; then cat /tmp/topics.err >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$repo_rc" -ne 0 ]; then cat /tmp/repo-settings.err >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish owner-requested release from the tested main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$head" = "$GITHUB_SHA"
          if gh release view v3.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v3.2.0 already exists; refusing to replace an existing release.' >&2
            exit 1
          fi
          gh release create v3.2.0 \
            "$RUNNER_TEMP/release/LunAstra-3.2.0.zip" \
            "$RUNNER_TEMP/release/LunAstra-3.2.0-source.zip" \
            "$RUNNER_TEMP/release/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'LunAstra 3.2.0 — Fixed Seven' \
            --notes-file docs/RELEASE_3.2.0.md
